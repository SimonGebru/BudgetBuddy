<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budgify Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }

      .wrapper {
        max-width: 420px;
      }

      h1 {
        margin-bottom: 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>You're offline</h1>
      <p>Budgify could not connect to the internet right now. Please check your connection and try again.</p>
    </div>
  </body>
</html>

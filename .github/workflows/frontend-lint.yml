name: Frontend Lint

on:
  push:
    branches: [main, dev]
    paths:
      - "client/budgetbuddy-frontend/**"
      - ".github/workflows/frontend-lint.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "client/budgetbuddy-frontend/**"
      - ".github/workflows/frontend-lint.yml"

jobs:
  frontend-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/budgetbuddy-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/budgetbuddy-frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint